name: FoldFinance APK from ZIP

'on':
  workflow_dispatch:
  push:
    paths:
      - 'FoldFinance_Android_Source_v0.4.zip'
      - '.github/workflows/build-apk-from-zip.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack FoldFinance v0.4
        run: |
          test -f FoldFinance_Android_Source_v0.4.zip
          unzip -q FoldFinance_Android_Source_v0.4.zip
          test -f FoldFinance/settings.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Android APK
        run: gradle --no-daemon -p FoldFinance :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FoldFinance-v0.4-debug-apk
          path: FoldFinance/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
