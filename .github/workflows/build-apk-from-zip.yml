name: FoldFinance QA v0.6 APK

'on':
  workflow_dispatch:
  push:
    paths:
      - 'FoldFinance_Android_Source_v0.6_QA.zip'
      - '.github/workflows/build-apk-from-zip.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Unpack FoldFinance QA v0.6
        run: |
          test -f FoldFinance_Android_Source_v0.6_QA.zip
          unzip -q FoldFinance_Android_Source_v0.6_QA.zip
          test -f FoldFinance/settings.gradle.kts
          test -f FoldFinance/app/src/main/java/kr/personal/foldfinance/ui/AssetsScreen.kt
      - name: Confirm core-only manifest and version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest=Path('FoldFinance/app/src/main/AndroidManifest.xml').read_text()
          build=Path('FoldFinance/app/build.gradle.kts').read_text()
          assert 'NOTIFICATION_LISTENER' not in manifest
          assert 'applicationId = "kr.personal.foldfinance.qa.v06"' in build
          assert 'versionCode = 6' in build
          assert 'val composeBom = platform(' in build.split('dependencies {', 1)[1]
          assert 'version = 5' in Path('FoldFinance/app/src/main/java/kr/personal/foldfinance/data/FinanceDatabase.kt').read_text()
          assert 'KPASS_REBATE' in Path('FoldFinance/app/src/main/java/kr/personal/foldfinance/domain/FinanceLogic.kt').read_text()
          print('Core-only QA checks passed')
          PY
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build QA APK
        run: gradle --no-daemon -p FoldFinance :app:assembleDebug --stacktrace
      - name: Upload QA APK
        uses: actions/upload-artifact@v4
        with:
          name: FoldFinance-QA-v0.6-debug-apk
          path: FoldFinance/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
